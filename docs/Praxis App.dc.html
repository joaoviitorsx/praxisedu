<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <style>
    body{margin:0}
    *{box-sizing:border-box}
    input,textarea,button{font-family:inherit}
    input::placeholder,textarea::placeholder{color:#64748B}
    .px-scroll::-webkit-scrollbar{display:none}
    a{color:#C2410C}
    a:hover{color:#9A3412}
    @keyframes pxPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
    @keyframes pxGlow{0%,100%{box-shadow:0 4px 0 #D99A1E,0 0 0 0 rgba(255,197,61,.6)}50%{box-shadow:0 4px 0 #D99A1E,0 0 0 8px rgba(255,197,61,0)}}
    @keyframes pxShimmer{0%{opacity:1}50%{opacity:.45}100%{opacity:1}}
    @keyframes pxDot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
    @keyframes pxSpin{to{transform:rotate(360deg)}}
    @keyframes pxIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
    @keyframes pxUp{from{transform:translateY(100%)}to{transform:none}}
    @keyframes pxPop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
    @keyframes pxFade{from{opacity:0}to{opacity:1}}
    @keyframes pxToast{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    @keyframes pxBounce{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.1)}100%{transform:scale(1)}}
    @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</helmet>
<div style="width:414px;height:868px;padding:12px;background:#1A1A2E;border-radius:62px;box-shadow:0 30px 60px -24px rgba(26,26,46,.5), inset 0 0 0 2px #34345A;flex-shrink:0">
  <div style="position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:#F7F7FA;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#1A1A2E;isolation:isolate">
    <sc-if value="{{ mAuth }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Auth" screen="{{ screen }}" go="{{ go }}" back="{{ back }}" sala-quiz="{{ salaQuiz }}" set-sala="{{ setSala }}" joined="{{ joined }}" set-joined="{{ setJoined }}" role="{{ role }}" set-role="{{ setRole }}" style="position:absolute;inset:0" hint-size="390px,844px"></dc-import>
    </sc-if>
    <sc-if value="{{ mProf }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Professor" screen="{{ screen }}" go="{{ go }}" back="{{ back }}" sala-quiz="{{ salaQuiz }}" set-sala="{{ setSala }}" joined="{{ joined }}" set-joined="{{ setJoined }}" style="position:absolute;inset:0" hint-size="390px,844px"></dc-import>
    </sc-if>
    <sc-if value="{{ mStud }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Estudante" screen="{{ screen }}" go="{{ go }}" back="{{ back }}" sala-quiz="{{ salaQuiz }}" set-sala="{{ setSala }}" joined="{{ joined }}" set-joined="{{ setJoined }}" style="position:absolute;inset:0" hint-size="390px,844px"></dc-import>
    </sc-if>
    <div style="position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 46px;pointer-events:none;z-index:90;color:{{ sbColor }}">
      <span style="font-size:17px;font-weight:700;letter-spacing:-0.01em">9:41</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div style="display:flex;align-items:flex-end;gap:2px;height:11px">
          <div style="width:3px;height:4px;border-radius:1px;background:currentColor"></div>
          <div style="width:3px;height:6px;border-radius:1px;background:currentColor"></div>
          <div style="width:3px;height:8px;border-radius:1px;background:currentColor"></div>
          <div style="width:3px;height:11px;border-radius:1px;background:currentColor"></div>
        </div>
        <dc-import name="Icon" n="wifi" size="17" sw="2.6" color="currentColor" hint-size="17px,17px"></dc-import>
        <div style="display:flex;align-items:center;gap:1px">
          <div style="width:25px;height:12px;border-radius:4px;border:1.5px solid currentColor;padding:1.5px;opacity:.9"><div style="width:80%;height:100%;border-radius:2px;background:currentColor"></div></div>
          <div style="width:2px;height:4px;border-radius:0 2px 2px 0;background:currentColor;opacity:.5"></div>
        </div>
      </div>
    </div>
    <div style="position:absolute;top:11px;left:50%;margin-left:-63px;width:126px;height:37px;border-radius:20px;background:#000;z-index:91;pointer-events:none"></div>
    <div style="position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;z-index:91;pointer-events:none;background:{{ hiColor }}"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:414,&quot;height&quot;:868},&quot;start&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;01&quot;,&quot;03&quot;,&quot;03e&quot;,&quot;04&quot;,&quot;05&quot;,&quot;05ok&quot;,&quot;06&quot;,&quot;07&quot;,&quot;08&quot;,&quot;09&quot;,&quot;10&quot;,&quot;18a&quot;,&quot;18b&quot;,&quot;19&quot;,&quot;20&quot;,&quot;21a&quot;,&quot;21b&quot;,&quot;22&quot;,&quot;23a&quot;,&quot;23b&quot;,&quot;24&quot;,&quot;32a&quot;,&quot;32b&quot;,&quot;25&quot;,&quot;25ok&quot;,&quot;11&quot;,&quot;12&quot;,&quot;12ok&quot;,&quot;27&quot;,&quot;26&quot;,&quot;13&quot;,&quot;28&quot;,&quot;29&quot;,&quot;30&quot;,&quot;14&quot;,&quot;31&quot;,&quot;15&quot;,&quot;16&quot;,&quot;17&quot;,&quot;33&quot;,&quot;32c&quot;],&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;persist&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sala&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;jump&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;onScreen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;},&quot;onSala&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(on: boolean) =&gt; void&quot;}}">
const AUTH = ['01','03','03e','04','05','05ok'];
const PROF = ['06','07','08','09','10','18a','18b','19','20','21a','21b','22','23a','23b','24','32a','32b'];
const LIGHT = [...PROF, '15', '26', '30'];
class Component extends DCLogic {
  constructor(p) {
    super(p);
    let s = p.start || '01';
    if (p.persist) { try { s = localStorage.getItem('praxis-screen') || s; } catch (e) {} }
    this.state = { salaQuiz: (p.sala || s === '14') ? 'A Célula' : null, joined: true, screen: s, hist: [], role: PROF.includes(s) ? 'professor' : 'estudante' };
  }
  componentDidMount() { this.props.onScreen && this.props.onScreen(this.state.screen); }
  componentDidUpdate(pp) {
    if (pp.sala !== this.props.sala) this.setState(st => ({ salaQuiz: this.props.sala ? (st.salaQuiz || 'A Célula') : null }));
    if (pp.jump !== this.props.jump && this.props.start) {
      const s = this.props.start;
      this.setState({ ...(s === '14' ? { salaQuiz: this.state.salaQuiz || 'A Célula' } : {}), screen: s, hist: [], role: PROF.includes(s) ? 'professor' : (AUTH.includes(s) ? this.state.role : 'estudante') }, () => this.save());
    }
  }
  save() {
    if (this.props.persist) { try { localStorage.setItem('praxis-screen', this.state.screen); } catch (e) {} }
    this.props.onScreen && this.props.onScreen(this.state.screen);
  }
  go = (id) => this.setState(s => ({ screen: id, hist: [...s.hist, s.screen].slice(-30) }), () => this.save());
  back = () => this.setState(s => {
    const hist = s.hist.slice(); const prev = hist.pop();
    return { screen: prev || '01', hist };
  }, () => this.save());
  setRole = (r) => this.setState({ role: r });
  setSala = (q) => { this.setState({ salaQuiz: q }); this.props.onSala && this.props.onSala(!!q); };
  setJoined = (j) => this.setState({ joined: j });
  renderVals() {
    const sc = this.state.screen;
    const mAuth = AUTH.includes(sc), mProf = PROF.includes(sc);
    return { salaQuiz: this.state.salaQuiz, setSala: this.setSala, joined: this.state.joined, setJoined: this.setJoined, screen: sc, go: this.go, back: this.back, role: this.state.role, setRole: this.setRole, mAuth, mProf, mStud: !mAuth && !mProf, sbColor: LIGHT.includes(sc) ? '#FFFFFF' : '#1A1A2E', hiColor: ['26', '30'].includes(sc) ? '#FFFFFF' : '#1A1A2E' };
  }
}
</script>
</body>
</html>
